<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Caminhos da Cidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0d1e; --panel:rgba(14,16,40,.93); --panel2:#1b1f4a; --gold:#f5c35b; --gold2:#b8862b;
  --text:#f3ecdc; --muted:#a9a6c7; --good:#5fe08a; --bad:#ff5a6e; --mid:#ffd166;
  --px:'Press Start 2P', monospace; --vt:'VT323', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;color:var(--text);font-family:var(--vt);user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05060f}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 60px rgba(0,0,0,.6)}
.hidden{opacity:0;pointer-events:none!important;visibility:hidden}
.fadeable{transition:opacity .9s ease, visibility .9s, transform .9s ease}

/* HUD */
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));display:flex;align-items:center;gap:10px;z-index:20;pointer-events:none}
#empWrap{flex:1;background:var(--panel);border:3px solid var(--gold2);box-shadow:0 0 0 3px var(--ink),0 6px 0 rgba(0,0,0,.4);padding:7px 10px 8px;position:relative}
#empLabel{font-family:var(--px);font-size:9px;letter-spacing:1px;color:var(--gold);display:flex;justify-content:space-between;margin-bottom:6px}
#sitCounter{color:var(--muted)}
#bar{position:relative;height:14px;background:#090a1c;border:2px solid #3a3f78;overflow:hidden}
#bar::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.05) 9px 10px)}
#barNeg,#barPos{position:absolute;top:0;bottom:0;transition:width .9s cubic-bezier(.2,1.4,.4,1)}
#barNeg{right:50%;width:0;background:linear-gradient(90deg,#7a1037,#ff5a6e);box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
#barPos{left:50%;width:0;background:linear-gradient(90deg,#45d38a,#b6ff8f);box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
#barMid{position:absolute;left:calc(50% - 1px);top:-2px;bottom:-2px;width:2px;background:var(--gold)}
#bar.flash-good{animation:fg .9s}
#bar.flash-bad{animation:fb .9s}
#bar.flash-mid{animation:fm .9s}
@keyframes fg{0%,60%{box-shadow:0 0 18px 4px var(--good)}100%{box-shadow:none}}
@keyframes fb{0%,60%{box-shadow:0 0 18px 4px var(--bad)}100%{box-shadow:none}}
@keyframes fm{0%,60%{box-shadow:0 0 18px 4px var(--mid)}100%{box-shadow:none}}
#scorePop{position:absolute;right:10px;top:100%;margin-top:8px;font-family:var(--px);font-size:12px;padding:8px 10px;background:var(--panel);border:3px solid var(--gold2);white-space:nowrap;transition:opacity .5s,transform .5s}
#scorePop.hidden{transform:translateY(-8px)}
#scorePop .d{font-size:16px;margin-right:8px}
#muteBtn{pointer-events:auto;width:44px;height:44px;background:var(--panel);border:3px solid var(--gold2);color:var(--gold);font-size:18px;cursor:pointer;box-shadow:0 0 0 3px var(--ink)}

#banner{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:15;font-family:var(--px);font-size:11px;color:var(--gold);background:rgba(10,10,30,.75);padding:9px 16px;border-top:2px solid var(--gold2);border-bottom:2px solid var(--gold2);letter-spacing:1px;white-space:nowrap}

/* Menu */
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:min(9vh,80px);text-align:center;background:linear-gradient(180deg,rgba(5,6,20,.55) 0%,rgba(5,6,20,0) 45%,rgba(5,6,20,0) 70%,rgba(5,6,20,.6) 100%)}
#menu.hidden{transform:translateY(-14px)}
#title{font-family:var(--px);font-size:clamp(22px,5.4vw,52px);line-height:1.25;color:#ffe7a8;text-shadow:3px 3px 0 #b5562a,6px 6px 0 #3b1530,0 0 30px rgba(255,190,90,.5);margin:0 16px;letter-spacing:2px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
#subtitle{font-size:clamp(18px,2.6vw,26px);color:#fff4dd;text-shadow:2px 2px 0 #1b1030;margin:16px 16px 0}
#menuBottom{position:absolute;bottom:min(8vh,64px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.pxbtn{font-family:var(--px);font-size:clamp(12px,1.8vw,16px);color:#2a1606;background:linear-gradient(#ffe08a,#f5b942);border:none;padding:16px 30px;cursor:pointer;box-shadow:0 0 0 3px #3b1d07,0 6px 0 3px #3b1d07,inset 0 -4px 0 #c7811f,inset 0 3px 0 #fff3c4;letter-spacing:1px;transition:transform .1s,filter .2s}
.pxbtn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.pxbtn:active{transform:translateY(3px);box-shadow:0 0 0 3px #3b1d07,0 2px 0 3px #3b1d07,inset 0 -4px 0 #c7811f}
#startBtn{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #3b1d07,0 6px 0 3px #3b1d07,inset 0 -4px 0 #c7811f,inset 0 3px 0 #fff3c4,0 0 28px 6px rgba(255,200,90,.55)}}
#menuHint{font-size:clamp(16px,2vw,21px);color:#e9e4ff;text-shadow:2px 2px 0 #000;padding:0 16px}
#replayNote{font-family:var(--px);font-size:10px;color:#bfe9ff;text-shadow:2px 2px 0 #000;min-height:12px}

/* Dialog */
#dialog{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(880px,calc(100vw - 24px));z-index:25;background:var(--panel);border:3px solid var(--gold2);box-shadow:0 0 0 3px var(--ink),0 0 0 6px rgba(245,195,91,.25),0 10px 30px rgba(0,0,0,.6);padding:24px 22px 18px;min-height:128px;cursor:pointer}
#dialog.hidden{transform:translateX(-50%) translateY(20px)}
#nameTag{position:absolute;top:-17px;left:16px;font-family:var(--px);font-size:11px;padding:8px 12px;background:var(--gold);color:#2a1606;box-shadow:0 0 0 3px var(--ink)}
#nameTag.narr{background:#8f8bd1;color:#14122e}
#dlgText{font-size:clamp(21px,2.6vw,27px);line-height:1.18;min-height:64px;white-space:pre-wrap}
#dlgText.narr{color:#d8d4ff;font-style:italic}
#dlgNext{position:absolute;right:14px;bottom:8px;color:var(--gold);font-size:18px;animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#choices{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(880px,calc(100vw - 24px));z-index:26;display:flex;flex-direction:column;gap:9px}
#choices .prompt{font-family:var(--px);font-size:11px;color:var(--gold);background:var(--panel);padding:10px 14px;border:3px solid var(--gold2);align-self:flex-start;box-shadow:0 0 0 3px var(--ink)}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);color:var(--text);border:3px solid #3a3f78;box-shadow:0 0 0 3px var(--ink);font-family:var(--vt);font-size:clamp(19px,2.3vw,24px);line-height:1.12;padding:10px 14px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s;opacity:0;animation:cin .35s forwards}
.choice:nth-child(3){animation-delay:.08s}.choice:nth-child(4){animation-delay:.16s}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.choice:hover,.choice:focus-visible{border-color:var(--gold);background:#22265a;transform:translateX(6px);outline:none}
.choice .k{font-family:var(--px);font-size:12px;color:#2a1606;background:var(--gold);padding:6px 8px;flex:none;margin-top:2px}

/* Reflection */
#reflect{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:28;width:min(560px,calc(100vw - 32px));background:#f3ead2;color:#2a2238;border:4px solid #2a2238;box-shadow:8px 8px 0 rgba(0,0,0,.5),inset 0 0 0 3px #d9c79a;padding:20px 22px 18px}
#reflect.hidden{transform:translate(-50%,-44%)}
#refTag{font-family:var(--px);font-size:9px;color:#7a4d12;letter-spacing:1px}
#refTitle{font-family:var(--px);font-size:clamp(12px,1.8vw,15px);margin:10px 0 12px;line-height:1.4;color:#3b1d5e}
#refText{font-size:clamp(19px,2.2vw,23px);line-height:1.15}
#refBtn{margin-top:16px;float:right}

/* Controls */
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:18;pointer-events:none}
.ctl{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:rgba(14,16,40,.7);border:3px solid var(--gold2);color:var(--gold);font-family:var(--px);font-size:22px;touch-action:none;cursor:pointer}
.ctl:active,.ctl.on{background:rgba(245,195,91,.35)}
#hint{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:17;font-family:var(--px);font-size:10px;color:#fff;background:rgba(10,10,30,.75);padding:10px 14px;border:2px solid var(--gold2);text-align:center;line-height:1.6;max-width:calc(100vw - 32px);width:max-content;animation:bob 1s steps(2) infinite}

/* Fade + black text */
#fade{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none;transition:opacity .6s}
#blackText{position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(24px,3.4vw,38px);color:#ddd;padding:24px;pointer-events:none;transition:opacity 1.2s}

/* Ending */
#ending{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,4,14,.72);overflow:auto}
#endCard{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:4px solid var(--gold2);box-shadow:0 0 0 4px var(--ink),0 0 60px rgba(0,0,0,.7);padding:26px 26px 22px}
#endTag{font-family:var(--px);font-size:clamp(11px,1.6vw,14px);letter-spacing:1px}
#endTitle{font-family:var(--px);font-size:clamp(16px,2.8vw,26px);line-height:1.35;margin:14px 0 6px}
#endScore{font-family:var(--px);font-size:12px;color:var(--muted);margin-bottom:12px}
#endBar{position:relative;height:16px;background:#090a1c;border:2px solid #3a3f78;margin-bottom:18px}
#endBar .z{position:absolute;top:0;bottom:0}
#endBar .pin{position:absolute;top:-6px;bottom:-6px;width:4px;background:#fff;box-shadow:0 0 10px #fff;transition:left 1.4s cubic-bezier(.2,1.2,.4,1)}
#endBarLbl{display:flex;justify-content:space-between;font-family:var(--px);font-size:8px;color:var(--muted);margin:-12px 0 16px}
.endH{font-family:var(--px);font-size:10px;color:var(--gold);margin:18px 0 8px;letter-spacing:1px}
#endText,#endConseq{font-size:clamp(19px,2.2vw,23px);line-height:1.2}
#endRecap{list-style:none;padding:0;margin:0;font-size:clamp(17px,2vw,21px);line-height:1.15}
#endRecap li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #3a3f78}
#endRecap b{font-family:var(--px);font-size:10px;flex:none}
#endBtns{display:flex;justify-content:flex-end;margin-top:20px}
@media (max-width:640px){
  #hud{top:8px}
  #banner{top:80px;font-size:9px}
  .ctl{width:64px;height:64px;font-size:18px}
  #dialog{padding:22px 14px 16px}
  #endCard{padding:20px 16px}
}
@media (hover:hover) and (pointer:fine){ #controls{display:none} }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="400" height="225"></canvas></div>

<div id="hud" class="fadeable hidden">
  <div id="empWrap">
    <div id="empLabel"><span>EMPATIA</span><span id="sitCounter">SITUAÇÃO 0/5</span></div>
    <div id="bar"><div id="barNeg"></div><div id="barPos"></div><div id="barMid"></div></div>
    <div id="scorePop" class="hidden"><span class="d"></span><span class="t"></span></div>
  </div>
  <button id="muteBtn" title="Som" aria-label="Ligar ou desligar som">♪</button>
</div>
<div id="banner" class="fadeable hidden"></div>

<div id="menu" class="fadeable">
  <h1 id="title">CAMINHOS<br>DA CIDADE</h1>
  <div id="subtitle">Um RPG narrativo sobre escolhas, empatia e sociedade</div>
  <div id="menuBottom">
    <div id="replayNote"></div>
    <button id="startBtn" class="pxbtn">COMEÇAR</button>
    <div id="menuHint">← → / A D para caminhar · Espaço/Enter avança · 1 2 3 escolhem</div>
  </div>
</div>

<div id="dialog" class="fadeable hidden"><div id="nameTag"></div><div id="dlgText"></div><div id="dlgNext">▼</div></div>
<div id="choices" class="hidden"></div>

<div id="reflect" class="fadeable hidden">
  <div id="refTag">📘 REFLEXÃO SOCIOLÓGICA</div>
  <div id="refTitle"></div>
  <div id="refText"></div>
  <button id="refBtn" class="pxbtn">CONTINUAR</button>
  <div style="clear:both"></div>
</div>

<div id="controls" class="fadeable hidden"><button class="ctl" id="btnL" aria-label="Andar para a esquerda">◀</button><button class="ctl" id="btnR" aria-label="Andar para a direita">▶</button></div>
<div id="hint" class="fadeable hidden">SEGURE → PARA CAMINHAR</div>

<div id="ending" class="fadeable hidden">
  <div id="endCard">
    <div id="endTag"></div>
    <div id="endTitle"></div>
    <div id="endScore"></div>
    <div id="endBar"><div class="z" style="left:0;width:39%;background:#5a1430"></div><div class="z" style="left:39%;width:22%;background:#4a4a66"></div><div class="z" style="left:61%;width:39%;background:#2e6b4a"></div><div class="pin" id="endPin" style="left:50%"></div></div>
    <div id="endBarLbl"><span>INFERNO</span><span>PURGATÓRIO</span><span>CÉU</span></div>
    <div class="endH">EXPLICAÇÃO SOCIOLÓGICA</div>
    <div id="endText"></div>
    <div class="endH">CONSEQUÊNCIA</div>
    <div id="endConseq"></div>
    <div class="endH">SUAS ESCOLHAS</div>
    <ul id="endRecap"></ul>
    <div id="endBtns"><button id="endBtn" class="pxbtn">RECOMEÇAR</button></div>
  </div>
</div>

<div id="fade"></div>
<div id="blackText" class="hidden"></div>

<script>

'use strict';
/* =========================================================
   CAMINHOS DA CIDADE — motor, utilidades, áudio e sprites
   ========================================================= */
const $ = id => document.getElementById(id);
const cv = $('cv'), mainCtx = cv.getContext('2d'); let ctx = mainCtx;
const H = 225; let W = 400;
const lc = document.createElement('canvas'), lctx = lc.getContext('2d');
const FEET = 176;

function resize(){
  const a = innerWidth / innerHeight;
  W = Math.round(Math.min(520, Math.max(300, H * a)));
  cv.width = W; cv.height = H; lc.width = W; lc.height = H;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

/* ---------- utilidades ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const hash = n => { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const _hx = {};
function hexRGB(h){ if (_hx[h]) return _hx[h]; const n = parseInt(h.slice(1), 16); return _hx[h] = [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t){ const A = hexRGB(a), B = hexRGB(b); return `rgb(${A[0] + (B[0] - A[0]) * t | 0},${A[1] + (B[1] - A[1]) * t | 0},${A[2] + (B[2] - A[2]) * t | 0})`; }
const _sh = {};
function shade(h, k){ const key = h + k; if (_sh[key]) return _sh[key]; const c = hexRGB(h).map(v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255)); return _sh[key] = '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- primitivas pixel ---------- */
function R(x, y, w, h, c){ if (c) ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function pxCircle(cx, cy, r, c, g = ctx){ g.fillStyle = c; for (let y = -r; y <= r; y++){ const w = Math.round(Math.sqrt(r * r - y * y)); g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } }
function txt(s, x, y, c, size = 8, align = 'center'){ ctx.font = `${size}px "Press Start 2P", monospace`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = c; ctx.fillText(s, x, y); }

/* ---------- entrada ---------- */
const input = { left: false, right: false, last: 0 };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { input.left = true; input.last = performance.now(); }
  if (k === 'arrowright' || k === 'd') { input.right = true; input.last = performance.now(); }
  if (k === ' ' || k === 'enter') { e.preventDefault(); if (!e.repeat) onAdvance(); }
  if ('123'.includes(k)) onChoiceKey(+k - 1);
  if (k === 'm') Sound.toggle();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') input.left = false;
  if (k === 'arrowright' || k === 'd') input.right = false;
});
function holdBtn(el, prop){
  const on = e => { e.preventDefault(); input[prop] = true; input.last = performance.now(); el.classList.add('on'); };
  const off = () => { input[prop] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}
holdBtn($('btnL'), 'left'); holdBtn($('btnR'), 'right');
addEventListener('blur', () => { input.left = input.right = false; });

/* ---------- áudio sintetizado ---------- */
const Sound = {
  ac: null, master: null, music: null, sfx: null, muted: false, mode: 'none', step: 0, timer: null,
  init(){
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : .55; this.master.connect(this.ac.destination);
      this.music = this.ac.createGain(); this.music.gain.value = .22; this.music.connect(this.master);
      this.sfx = this.ac.createGain(); this.sfx.gain.value = .7; this.sfx.connect(this.master);
    } catch (e) { this.ac = null; }
  },
  toggle(){ this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : .55; $('muteBtn').textContent = this.muted ? '×' : '♪'; },
  tone(f, d, type = 'square', v = .1, when = 0, dest, slide){
    if (!this.ac) return; const t = this.ac.currentTime + when;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + d + .05);
  },
  noise(d, v = .2, freq = 1000, to){
    if (!this.ac) return; const t = this.ac.currentTime, n = this.ac.sampleRate * d | 0;
    const b = this.ac.createBuffer(1, n, this.ac.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = b; f.type = 'bandpass'; f.Q.value = 4; f.frequency.setValueAtTime(freq, t); if (to) f.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t);
  },
  blip(p = 520){ this.tone(p + Math.random() * 40, .045, 'square', .035); },
  footstep(){ this.noise(.05, .05, 300 + Math.random() * 200); },
  good(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .3, 'triangle', .12, i * .08)); },
  mid(){ [440, 415].forEach((f, i) => this.tone(f, .3, 'triangle', .1, i * .14)); },
  bad(){ [330, 262, 196].forEach((f, i) => this.tone(f, .35, 'sawtooth', .07, i * .12)); },
  honk(){ this.tone(415, .35, 'square', .08); this.tone(440, .35, 'square', .06); },

  if (cam.focus && cam.focus.track){ const a = cam.focus.track; tz = cam.focus.z; tx = a.x + a.dir * 10; ty = FEET - 34 + H * .1 / tz; k = 3; }
  else if (cam.focus){ tx = cam.focus.x; ty = cam.focus.y; tz = cam.focus.z; k = 3.2; }
  else if (G.scene === 'city'){ tx = G.state === 'menu' ? 250 : player.x + player.dir * 24; }
  else tx = 200;
  const f = 1 - Math.exp(-dt * k);
  cam.z = lerp(cam.z, tz, f); cam.x = lerp(cam.x, tx, f); cam.y = lerp(cam.y, ty, f);
  if (G.scene === 'city'){ const hw = W / (2 * cam.z), hh = H / (2 * cam.z); cam.x = clamp(cam.x, hw, WORLD_W - hw); cam.y = clamp(cam.y, hh, H - hh); }
}
function focusOn(a, z = 3.4){ const hp = headPos(a); cam.focus = { x: hp.x, y: hp.y + H * .13 / z, z }; }
function focusWide(x, z = 1.8){ cam.focus = { x, y: FEET - 40 + H * .1 / z, z }; }
function focusTrack(a, z = 1.6){ cam.focus = { track: a, z }; }
// NPC vai embora andando até sair da tela de verdade
function leave(a, dir, sp = 34){ a.loop = false; a.grab = false; a.raise = false; const tx = cam.x + dir * (W / (2 * cam.z) + 120); return walkTo(a, tx, sp).then(() => { a.hidden = true; }); }

function worldTransform(){
  const z = cam.z, sx = G.shake ? (Math.random() - .5) * G.shake : 0, sy = G.shake ? (Math.random() - .5) * G.shake : 0;
  ctx.setTransform(z, 0, 0, z, Math.round(W / 2 - cam.x * z + sx), Math.round(H / 2 - cam.y * z + sy));
}
function drawActors(list, t){
  list.sort((a, b) => a.y - b.y);
  for (const a of list){
    if (a.hidden) continue;
    if (!a.fly){ ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(Math.round(a.x - 6), Math.round(a.y - 1), 12, 2); }
    if (a.kind === 'dog') drawDog(a, t); else drawPerson(a, t);
    if (a.box){ const bx = Math.round(a.x + (a.dir > 0 ? 6 : -13)), by = Math.round(a.y - 17); R(bx, by, 8, 7, '#b88a52'); R(bx, by, 8, 1, '#d8aa72'); R(bx + 3, by, 2, 7, '#8a6232'); }
  }
}
function drawPigeons(t){
  for (const p of pigeons){ if (p.y < -20) continue; const x = Math.round(p.x), y = Math.round(p.y);
    const peck = !p.fly && Math.sin(t * 4 + p.ph) > .6 ? 2 : 0;
    R(x - 2, y - 4, 6, 3, '#8a8a9a'); R(x + 3, y - 6 + peck, 2, 2, '#6a6a7a'); R(x + 5, y - 5 + peck, 1, 1, '#e8a02a'); R(x - 3, y - 4, 2, 2, '#5a5a6a');
    if (p.fly){ const w = Math.sin(t * 30) > 0 ? -3 : 1; R(x - 1, y - 5 + w, 4, 2, '#a8a8b8'); } else { R(x, y - 1, 1, 1, '#e8a02a'); R(x + 2, y - 1, 1, 1, '#e8a02a'); }
  }
}
function render(t){
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (!bgDay){ ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H); txt('CARREGANDO...', W / 2, H / 2, '#f5c35b'); return; }
  const lights = [];
  if (G.scene === 'city'){
    const tod = G.tod, s = drawSky(tod, t, cam.x);
    drawHills(cam, s); drawFar(cam, s, t); drawMid(cam, s);
    worldTransform();
    const z = cam.z, L = Math.max(0, Math.floor(cam.x - W / (2 * z) - 4)), Rr = Math.min(WORLD_W, Math.ceil(cam.x + W / (2 * z) + 4)), w = Rr - L;
    ctx.drawImage(bgDay, L, 0, w, 160, L, 0, w, 160);
    if (s.n > 0){ ctx.globalAlpha = s.n; ctx.drawImage(bgNight, L, 0, w, 160, L, 0, w, 160); ctx.globalAlpha = 1; }
    if (L < 520){ drawFountain(t); drawNewsstand(s.n); for (const x of TREES) drawTree(x, t, s.n); }
    for (const lx of LAMPS){ if (lx < L - 20 || lx > Rr + 20) continue; drawLamp(lx, s.n); if (s.n > .05) lights.push({ x: lx + 9, y: 122, r: 78, a: .9 * Math.min(1, s.n * 2), c: '255,214,150' }); }
    for (const [a, b] of GAPS){ if (a - 10 > Rr || b + 10 < L) continue; drawTrafficLight(a - 6, t, s.n); drawTrafficLight(b + 4, t, s.n); }
    ctx.drawImage(groundCv, L, 0, w, 65, L, 160, w, 65);
    ctx.drawImage(propsCv, L, 0, w, 170, L, 0, w, 170);
    if (L < 300) drawBench();
    drawGoods(846 - 20, goodsGone); drawTrash(2406, t); drawCardboard(2930);
    drawPigeons(t);
    for (const p of peds) if (p.x > L - 20 && p.x < Rr + 20){ ctx.globalAlpha = .9; drawPerson(p, t); ctx.globalAlpha = 1; }
    drawActors(Object.values(actors), t);
    const vs = [...cars, van].sort((a, b) => a.y - b.y);
    for (const c of vs){ if (c.x < L - 90 || c.x > Rr + 90) continue; if (c === van) drawVan(van, t); else drawCar(c, t);
      if (s.n > .1 && c !== van){ lights.push({ x: c.x + c.dir * 38, y: c.y - 11, r: 46, a: .85, c: '255,240,200' }); lights.push({ x: c.x - c.dir * 33, y: c.y - 11, r: 14, a: .7, c: '255,40,40' }); } }
    if (van.x > L - 90 && van.x < Rr + 90 && !van.hidden) lights.push({ x: van.x, y: van.y - 38, r: 16, a: .7, c: Math.floor(t * 4) % 2 ? '255,50,50' : '60,110,255' });
    if (acc && acc.on){ drawFrontCar(acc.k); lights.push({ x: 3370, y: lerp(150, 196, acc.k), r: 40 + 160 * acc.k, a: 1, c: '255,255,230' }); }
    for (const l of STATIC_LIGHTS) if (l.x > L - 80 && l.x < Rr + 80) lights.push(l);
    lights.push({ x: player.x, y: FEET - 16, r: 40, a: .45 });
    if (G.speaker) { const hp = headPos(G.speaker); lights.push({ x: hp.x, y: hp.y, r: 26, a: .55 }); }
    drawParticles();
    drawLighting(lights, s.d, cam, s.n);
    ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = `rgba(255,150,70,${.22 * (1 - s.n)})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  } else {
    drawAfterBg(G.scene, t);
    worldTransform();
    drawAfterWorld(G.scene, t);
    drawActors(Object.values(actors), t);
    drawParticles();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const tint = { heaven: 'rgba(255,240,200,.12)', hell: 'rgba(255,60,20,.14)', purg: 'rgba(160,150,200,.12)' }[G.scene];
    ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  }
  // vinheta + barras de cinema
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (G.cineT > .01){ const b = Math.round(G.cineT * 16); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, b); ctx.fillRect(0, H - b, W, b); }
}
function drawParticles(){
  for (const p of particles){ ctx.fillStyle = p.c; if (p.k === 'spark') ctx.globalAlpha = Math.min(1, p.life); ctx.fillRect(Math.round(p.x), Math.round(p.y), p.k === 'steam' ? 2 : 1, p.k === 'leaf' ? 1 : (p.k === 'steam' ? 2 : 1)); ctx.globalAlpha = 1; }
}

const UI = { menu: $('menu'), hud: $('hud'), dialog: $('dialog'), name: $('nameTag'), text: $('dlgText'), next: $('dlgNext'), choices: $('choices'),
  reflect: $('reflect'), controls: $('controls'), hint: $('hint'), banner: $('banner'), fade: $('fade'), black: $('blackText'), ending: $('ending') };
const show = (el, on) => el.classList.toggle('hidden', !on);
const isTouch = !matchMedia('(hover:hover) and (pointer:fine)').matches;
UI.hint.textContent = isTouch ? 'SEGURE O BOTÃO DA DIREITA PARA CAMINHAR' : 'SEGURE D OU SETA DIREITA PARA CAMINHAR';
let DLG = null, bannerTimer = 0, popTimer = 0;

function tween(dur, fn){ return new Promise(res => { const t0 = performance.now(); const step = now => { const k = Math.min(1, (now - t0) / (dur * 1000)); fn(k); if (k < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); }

function say(line){
  return new Promise(res => {
    if (line.act && ACTS[line.act]) ACTS[line.act]();
    Object.values(actors).forEach(x => x.talking = false);
    const a = line.s ? actors[line.s] : null;
    G.speaker = a;
    if (a){
      if (line.e) a.expr = line.e;
      if (a !== player){
        if (line.look === 'cross') a.dir = 1;
        else if (!a.still && !a.goal){ const tg = line.look ? actors[line.look] : player; if (tg) a.dir = tg.x >= a.x ? 1 : -1; }
        if (!player.goal) player.dir = a.x >= player.x ? 1 : -1;
      } else { const tg = line.look ? actors[line.look] : G.mainNpc; if (tg && !player.goal) player.dir = tg.x >= player.x ? 1 : -1; }
      focusOn(a, a.kind === 'dog' ? 3.8 : 3.4);
      a.talking = true;
      if (a.kind === 'dog') Sound.bark();
    } else focusWide(G.sceneCenter, G.scene === 'city' ? 1.7 : 1.3);
    UI.name.textContent = a ? a.name : 'NARRAÇÃO';
    UI.name.classList.toggle('narr', !a); UI.text.classList.toggle('narr', !a);
    UI.text.textContent = ''; UI.next.style.visibility = 'hidden';
    show(UI.dialog, true);
    const full = line.t, voice = a ? (CAST_DEF[a.id] || {}).voice || 500 : 0; let i = 0;
    const d = DLG = { done: false, res };
    d.finish = () => { clearInterval(d.timer); UI.text.textContent = full; d.done = true; if (a) a.talking = false; UI.next.style.visibility = 'visible'; };
    d.timer = setInterval(() => { i++; UI.text.textContent = full.slice(0, i); if (voice && a.kind !== 'dog' && i % 2 === 0 && full[i - 1] !== ' ') Sound.blip(voice); if (i >= full.length) d.finish(); }, 24);
  });
}
async function runLines(lines){ for (const l of lines) await say(l); hideDialog(); }
function hideDialog(){ show(UI.dialog, false); G.speaker = null; Object.values(actors).forEach(x => x.talking = false); }
function onAdvance(){
  if (G.reflectRes){ const r = G.reflectRes; G.reflectRes = null; show(UI.reflect, false); r(); return; }
  if (!DLG) return;
  if (!DLG.done) DLG.finish(); else { const r = DLG.res; DLG = null; r(); }
}
function onChoiceKey(i){ if (G.choosing) G.choosing(i); }
UI.dialog.addEventListener('click', onAdvance);
$('stage').addEventListener('pointerdown', () => { if (DLG) onAdvance(); });
$('refBtn').addEventListener('click', e => { e.stopPropagation(); onAdvance(); });
$('muteBtn').addEventListener('click', () => { Sound.init(); Sound.toggle(); });

function choose(sc){
  return new Promise(res => {
    focusWide(G.sceneCenter, 2.1);
    UI.choices.innerHTML = '';
    const p = document.createElement('div'); p.className = 'prompt'; p.textContent = sc.prompt; UI.choices.appendChild(p);
    sc.options.forEach((o, i) => {
      const b = document.createElement('button'); b.className = 'choice';
      b.innerHTML = `<span class="k">${'ABC'[i]}</span><span></span>`; b.lastChild.textContent = o.t;
      b.onclick = () => G.choosing && G.choosing(i); UI.choices.appendChild(b);
    });
    show(UI.choices, true);

  });
}
function updateBar(){
  $('barPos').style.width = Math.max(0, G.score) + '%';
  $('barNeg').style.width = Math.max(0, -G.score) + '%';
  $('sitCounter').textContent = `SITUAÇÃO ${Math.min(5, G.sceneIdx + (G.state === 'scene' ? 1 : 0))}/5`;
}
function applyScore(pts){
  G.score = clamp(G.score + pts, -50, 50); updateBar();
  const kind = pts > 0 ? 'good' : pts > -5 ? 'mid' : 'bad', col = { good: 'var(--good)', mid: 'var(--mid)', bad: 'var(--bad)' }[kind];
  const pop = $('scorePop'); pop.querySelector('.d').textContent = (pts > 0 ? '+' : '') + pts; pop.querySelector('.d').style.color = col;
  pop.querySelector('.t').textContent = `EMPATIA: ${G.score}`; show(pop, true);
  const bar = $('bar'); bar.className = ''; void bar.offsetWidth; bar.className = 'flash-' + kind;
  Sound[kind]();
  clearTimeout(popTimer); popTimer = setTimeout(() => show(pop, false), 3800);
}

  return new Promise(res => { G.reflectRes = res; });
}

  const f1 = actors.fiscal1, f2 = actors.fiscal2; f1.loop = f2.loop = false;
  await Promise.all([walkTo(f1, 974, 30), walkTo(f2, 986, 30)]);
  for (const f of [f2, f1]){ f.dir = 1; f.moving = true; await tween(.5, k => { f.y = FEET + k * 20; }); f.moving = false; f.hidden = true; }
  await tween(.6, k => { van.door = 1 - k; });
  await sleep(400); Sound.honk(); van.go = true;
}

async function startGame(){
  if (G.state !== 'menu') return;
  Sound.init(); Sound.setMusic('city');
  G.state = 'rise'; show(UI.menu, false);
  await sleep(600);
  player.phone = false; player.dir = 1; player.expr = 'neutral'; player.pose = 'rise'; player.riseT = 0;
  await tween(1.5, k => player.riseT = k);
  player.pose = 'stand'; delete player.riseT;
  G.sceneIdx = 0; updateBar(); show(UI.hud, true);
  G.state = 'cut'; G.cine = 1; G.mainNpc = null; G.sceneCenter = player.x + 30;
  await sleep(400);
  await runLines(OPENING);
  cam.focus = null; G.cine = 0; G.state = 'walk'; show(UI.controls, true); input.last = performance.now();
}
$('startBtn').addEventListener('click', startGame);

async function runScene(sc){
  G.state = 'scene'; input.left = input.right = false; show(UI.controls, false); show(UI.hint, false); G.cine = 1; updateBar();
  G.mainNpc = actors[sc.cast[0]];
  G.sceneCenter = (sc.cast.reduce((s, id) => s + actors[id].x, 0) + sc.stand) / (sc.cast.length + 1);
  await walkTo(player, sc.stand, 40); player.dir = 1;
  await sleep(250);
  await runLines(sc.intro);
  const idx = await choose(sc), opt = sc.options[idx], pts = [10, -2, -10][idx];
  G.choices.push({ title: sc.title, theme: sc.theme, letter: 'ABC'[idx], pts });
  applyScore(pts);
  await sleep(300);
  await say({ s: 'voce', e: opt.e, look: opt.look, t: opt.t.replace(/^"|"$/g, '') });
  hideDialog();
  const fx = FX[opt.fx] || {};
  if (fx.pre){ focusTrack(player, 1.6); await fx.pre(opt); }
  await runLines(opt.after);
  await sleep(200);
  cam.focus = null; await showReflect(sc.reflect);
  if (fx.post) fx.post(opt);
  G.sceneIdx++; G.speaker = null; G.cine = 0;
  if (G.sceneIdx === 5){ await sleep(1200); G.cine = 1; G.sceneCenter = player.x + 20; await runLines(BEFORE_ACCIDENT); G.cine = 0; cam.focus = null; }
  G.state = 'walk'; updateBar(); show(UI.controls, true); input.last = performance.now();
}

async function runAccident(){
  G.state = 'accident'; input.left = input.right = false; show(UI.controls, false); show(UI.hint, false); G.cine = 1;
  const d = actors.dog;
  if (d.follow){ d.follow = false; walkTo(d, 3292, 50).then(() => { d.dir = 1; d.state = 'scared'; }); }
  await walkTo(player, 3352, 30);
  await sleep(300);
  acc = { on: true, k: 0 }; Sound.honk();
  let turned = false, barked = false;
  await tween(2.1, k => {
    acc.k = k * k;
    if (!barked && k > .25 && !d.hidden && Math.abs(d.x - player.x) < 120){ barked = true; Sound.bark(); d.talking = true; }
    if (!turned && k > .5){ turned = true; player.expr = 'scared'; Sound.screech(); focusOn(player, 2.4); }
  });
  UI.fade.style.transition = 'opacity .05s'; UI.fade.style.background = '#fff'; UI.fade.style.opacity = 1;
  Sound.thud(); G.shake = 7;
  await sleep(1000); G.shake = 0; Sound.setMusic('none');
  UI.fade.style.transition = 'background 1.4s, opacity 1.4s'; UI.fade.style.background = '#000';
  await sleep(1700);
  await blackText('Um clarão. Um freio que não chega a tempo.', 2600);
  await blackText('E depois... silêncio.', 2200);
  const kind = endingFor(G.score);
  setupAfter(kind);
  Sound.setMusic(ENDINGS[kind].music);
  UI.fade.style.transition = 'opacity 2.2s'; UI.fade.style.opacity = 0;
  await sleep(2000);
  G.cine = 1; G.sceneCenter = 200; G.mainNpc = kind === 'hell' ? actors.demonio : actors.anjo;
  await runLines(ENDINGS[kind].lines);
  cam.focus = null; await sleep(900);
  showEnding(kind);
}
function setupAfter(kind){
  actors = {}; particles.length = 0; acc = null; G.scene = kind; G.state = 'after';
  const gy = kind === 'heaven' ? FEET : FEET - 2;
  player = makeActor('voce', { x: kind === 'purg' ? 200 : 168, y: gy, dir: 1, expr: 'scared' });
  if (kind === 'heaven') makeActor('anjo', { x: 238, y: gy, dir: -1 });
  if (kind === 'hell'){ makeActor('demonio', { x: 238, y: gy, dir: -1, expr: 'happy' }); makeActor('anjo', { x: 104, y: gy, dir: 1, hidden: true, alpha: 0, expr: 'neutral' }); }
  if (kind === 'purg'){ makeActor('demonio', { x: 134, y: gy, dir: 1 }); makeActor('anjo', { x: 268, y: gy, dir: -1, expr: 'neutral' }); }
  cam.x = 200; cam.y = H / 2; cam.z = 1; cam.focus = null;
}
function showEnding(kind){
  const E = ENDINGS[kind];
  G.state = 'end'; G.endKind = kind; G.cine = 0;
  $('endTag').textContent = E.tag; $('endTag').style.color = E.color;
  $('endTitle').textContent = E.title; $('endTitle').style.color = E.color;
  $('endScore').textContent = `PONTUAÇÃO FINAL DE EMPATIA: ${G.score > 0 ? '+' : ''}${G.score}`;
  $('endText').textContent = E.text; $('endConseq').textContent = E.conseq;
  const ul = $('endRecap'); ul.innerHTML = '';
  G.choices.forEach((c, i) => { const li = document.createElement('li'); const sp = document.createElement('span'); sp.textContent = `${i + 1}. ${c.title} — ${c.theme}`;
    const b = document.createElement('b'); b.textContent = `${c.letter}  ${c.pts > 0 ? '+' : ''}${c.pts}`; b.style.color = c.pts > 0 ? 'var(--good)' : c.pts > -5 ? 'var(--mid)' : 'var(--bad)';
    li.append(sp, b); ul.appendChild(li); });
  $('endBtn').textContent = E.btn;
  $('endPin').style.left = '50%';
  show(UI.ending, true); show(UI.hud, false);
  setTimeout(() => { $('endPin').style.left = `calc(${(G.score + 50)}% - 2px)`; }, 300);
}
async function restart(){
  if (G.state !== 'end') return;
  G.state = 'restarting';
  UI.fade.style.transition = 'opacity 1s'; UI.fade.style.background = '#fff'; UI.fade.style.opacity = 1;
  await sleep(1100);
  show(UI.ending, false);
  resetWorld(); G.state = 'menu'; Sound.setMusic('city'); updateBar();
  $('replayNote').textContent = G.endKind === 'heaven' ? '✦ UMA NOVA VIDA COMEÇA NO BANCO DA PRAÇA ✦' : '✦ UMA SEGUNDA CHANCE COMEÇA AGORA ✦';
  show(UI.menu, true);
  UI.fade.style.transition = 'opacity 1.8s'; UI.fade.style.opacity = 0;
}
$('endBtn').addEventListener('click', restart);

/* ---------- laço principal ---------- */
function update(dt, t){
  G.cineT = lerp(G.cineT, G.cine, 1 - Math.exp(-dt * 4));
  if (G.scene === 'city'){
    updateCity(dt, t);
    const target = G.state === 'menu' ? 0 : clamp((player.x - 300) / 2800, 0, 1);
    G.tod = lerp(G.tod, target, 1 - Math.exp(-dt * 2));
    if (G.state === 'menu'){ player.phone = (t % 9) > 5.5; }
    if (G.state !== 'menu' && G.state !== 'loading'){
      let z = 0; for (let i = 0; i < ZONES.length; i++) if (player.x >= ZONES[i][0]) z = i;
      if (z !== G.zone){ G.zone = z; UI.banner.textContent = '◆ ' + ZONES[z][1] + ' ◆'; show(UI.banner, true); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => show(UI.banner, false), 2800); }
    }
  }
  if (G.state === 'walk'){
    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    const limit = G.sceneIdx < 5 ? SCENES[G.sceneIdx].trigger : 3318;
    if (dir){ player.x = clamp(player.x + dir * 46 * dt, 20, limit); player.dir = dir; player.moving = true; }
    else player.moving = false;
    show(UI.hint, !dir && performance.now() - input.last > 3500);
    if (player.x >= limit){ player.moving = false; show(UI.hint, false); if (G.sceneIdx < 5) runScene(SCENES[G.sceneIdx]); else runAccident(); }
  }
  for (const a of Object.values(actors)) updateActor(a, dt);
  updateParticles(dt);
  updateCamera(dt);
}
let lastT = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; G.t += dt;
  try { update(dt, G.t); render(G.t); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
(async () => {
  resetWorld(); requestAnimationFrame(loop);
  $('startBtn').disabled = true; $('startBtn').textContent = 'CARREGANDO...';
  await buildWorld();
  G.state = 'menu'; $('startBtn').disabled = false; $('startBtn').textContent = 'COMEÇAR';
})();

</script>
